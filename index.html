<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <meta name="theme-color" content="#050b20"> <title>Text Counter | Blue Aurora</title> <style> * { box-sizing: border-box; margin: 0; padding: 0; } :root { --cyan: #53e7ff; --blue: #3984ff; --panel: rgba(13, 29, 65, 0.78); --text: #edf6ff; --muted: #9bb2d5; } body { min-height: 100vh; padding: 28px 16px 40px; font-family: Arial, Helvetica, sans-serif; color: var(--text); background: radial-gradient(ellipse at 15% 15%, #102d63 0%, transparent 42%), radial-gradient(ellipse at 85% 75%, #10275a 0%, transparent 45%), #050b20; overflow-x: hidden; } .aurora { position: fixed; width: 75vw; height: 220px; left: 12%; top: 5%; border-radius: 50%; background: linear-gradient( 90deg, transparent, rgba(0, 174, 255, .16), rgba(76, 91, 255, .20), transparent ); filter: blur(55px); animation: float 9s ease-in-out infinite alternate; pointer-events: none; z-index: -1; } .aurora.two { top: auto; bottom: 5%; left: 20%; background: linear-gradient( 90deg, transparent, rgba(0, 255, 220, .12), rgba(40, 120, 255, .20), transparent ); animation-delay: -4s; } @keyframes float { from { transform: translate(-8%, -10%) rotate(-8deg); } to { transform: translate(10%, 15%) rotate(8deg); } } .container { width: 100%; max-width: 850px; margin: 0 auto; } header { text-align: center; margin: 20px 0 30px; } .logo { width: 68px; height: 68px; display: grid; place-items: center; margin: 0 auto 17px; border: 1px solid rgba(83, 231, 255, .65); border-radius: 22px; background: linear-gradient(135deg, #173e76, #101b48); color: var(--cyan); font-size: 35px; box-shadow: 0 0 35px rgba(50, 183, 255, .22); } h1 { font-size: clamp(30px, 6vw, 46px); letter-spacing: -1.5px; margin-bottom: 10px; background: linear-gradient(90deg, #fff, #69eaff, #8e9cff); -webkit-background-clip: text; background-clip: text; color: transparent; } .subtitle { color: var(--muted); font-size: 15px; line-height: 1.6; } .badge { display: inline-block; margin-top: 18px; padding: 7px 13px; border: 1px solid rgba(83, 231, 255, .25); border-radius: 30px; color: var(--cyan); background: rgba(40, 150, 255, .08); font-size: 12px; letter-spacing: 1px; } .panel { padding: 22px; border: 1px solid rgba(122, 178, 255, .19); border-radius: 22px; background: var(--panel); box-shadow: 0 20px 60px rgba(0, 0, 0, .22); backdrop-filter: blur(15px); } label { display: block; margin-bottom: 12px; font-size: 14px; font-weight: bold; } textarea { display: block; width: 100%; min-height: 190px; resize: vertical; padding: 18px; border: 1px solid rgba(111, 170, 255, .24); border-radius: 15px; outline: none; background: rgba(3, 10, 29, .72); color: #f3f8ff; font: 15px/1.7 Arial, sans-serif; transition: border-color .2s, box-shadow .2s; } textarea::placeholder { color: #7188ac; } textarea:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(83, 231, 255, .08); } .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 17px; } .stat { min-width: 0; padding: 18px 8px; text-align: center; border: 1px solid rgba(113, 168, 255, .16); border-radius: 15px; background: linear-gradient( 145deg, rgba(27, 57, 108, .65), rgba(9, 20, 49, .😎 ); transition: transform .2s, border-color .2s; } .stat:hover { transform: translateY(-3px); border-color: rgba(83, 231, 255, .55); } .number { display: block; color: var(--cyan); font-size: clamp(22px, 4vw, 30px); font-weight: bold; overflow-wrap: anywhere; } .stat-name { display: block; margin-top: 8px; color: var(--muted); font-size: 12px; } .buttons { display: flex; gap: 12px; margin-top: 18px; } button { flex: 1; min-height: 48px; padding: 12px 16px; border: 1px solid transparent; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer; transition: transform .2s, filter .2s; } button:hover { transform: translateY(-2px); filter: brightness(1.12); } button:active { transform: scale(.98); } .copy { color: #041426; background: linear-gradient(100deg, #53e7ff, #69a8ff); } .clear { color: #d9e7ff; background: rgba(118, 149, 202, .10); border-color: rgba(143, 177, 232, .23); } .status { min-height: 22px; margin-top: 13px; text-align: center; color: var(--cyan); font-size: 13px; } footer { margin-top: 25px; text-align: center; color: #7188ac; font-size: 12px; } @media (max-width: 520px) { body { padding: 18px 12px 30px; } .panel { padding: 15px; } .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .buttons { flex-direction: column; } textarea { min-height: 165px; } } </style> </head> <body> <div class="aurora"></div> <div class="aurora two"></div> <main class="container"> <header> <div class="logo" aria-label="Text Counter logo">✦</div> <h1>Text Counter</h1> <p class="subtitle"> Count words, characters and more.<br> A simple tool with a Blue Aurora look. </p> <div class="badge">✧ BLUE AURORA EDITION</div> </header> <section class="panel"> <label for="textInput">Your text</label> <textarea id="textInput" placeholder="Start typing or paste your text here..." spellcheck="false" ></textarea> <div class="stats" aria-live="polite"> <div class="stat"> <span class="number" id="words">0</span> <span class="stat-name">Words</span> </div> <div class="stat"> <span class="number" id="characters">0</span> <span class="stat-name">Characters</span> </div> <div class="stat"> <span class="number" id="noSpaces">0</span> <span class="stat-name">No Spaces</span> </div> <div class="stat"> <span class="number" id="sentences">0</span> <span class="stat-name">Sentences</span> </div> </div> <div class="buttons"> <button class="copy" id="copyBtn" type="button"> Copy Text </button> <button class="clear" id="clearBtn" type="button"> Clear Text </button> </div> <p class="status" id="status" role="status"></p> </section> <footer> Made with ✦ Blue Aurora · Text Counter </footer> </main> <script> const input = document.getElementById("textInput"); const words = document.getElementById("words"); const characters = document.getElementById("characters"); const noSpaces = document.getElementById("noSpaces"); const sentences = document.getElementById("sentences"); const status = document.getElementById("status"); function updateCounts() { const text = input.value; words.textContent = text.trim() ? text.trim().split(/\s+/u).length : 0; characters.textContent = [...text].length; noSpaces.textContent = [...text.replace(/\s/gu, "")].length; const sentenceMatches = text.match(/[.!?。！？]+(?=\s|$)/gu); sentences.textContent = text.trim() ? (sentenceMatches || []).length : 0; status.textContent = ""; } input.addEventListener("input", updateCounts); document.getElementById("clearBtn").addEventListener("click", () => { input.value = ""; updateCounts(); status.textContent = "Text cleared!"; input.focus(); }); document.getElementById("copyBtn").addEventListener("click", async () => { if (!input.value) { status.textContent = "There is no text to copy."; return; } try { await navigator.clipboard.writeText(input.value); status.textContent = "Text copied successfully!"; } catch (error) { input.focus(); input.select(); const copied = document.execCommand("copy"); status.textContent = copied ? "Text copied successfully!" : "Select the text and copy it manually."; } }); </script> </body> </html>
