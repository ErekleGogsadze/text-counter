<!DOCTYPE html> <html lang="ka"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <meta name="theme-color" content="#070b18"> <title>ტექსტი+ | მთვლელი</title> <style> *{box-sizing:border-box} :root{--bg:#070b18;--card:#101a30;--line:#243553;--cyan:#54e5ff;--blue:#7189ff;--muted:#91a4c2} body{ margin:0;background:var(--bg);color:#f0f6ff; font-family:Arial,"Noto Sans Georgian",sans-serif; min-height:100vh } body:before,body:after{ content:"";position:fixed;z-index:-1;pointer-events:none; width:350px;height:350px;border-radius:50%;filter:blur(100px);opacity:.18 } body:before{background:#176aff;top:-130px;left:-100px} body:after{background:#00dfff;right:-150px;bottom:-100px} main{width:min(900px,94%);margin:auto;padding:30px 0} header{text-align:center;margin-bottom:28px} .logo{ width:76px;height:76px;margin:auto auto 14px;border-radius:24px; display:grid;place-items:center;font-size:35px;font-weight:900; color:#071324;background:linear-gradient(135deg,var(--cyan),var(--blue)); box-shadow:0 0 35px #42cfff30 } h1{font-size:36px;margin:0} h1 span{color:var(--cyan)} header p{color:var(--muted);font-size:13px} .card{ background:#101a30ed;border:1px solid var(--line); border-radius:18px;padding:20px;margin-bottom:16px } h2{font-size:15px;margin:0 0 15px} textarea{ display:block;width:100%;min-height:190px;resize:vertical; background:#080f20;border:1px solid #293c5c;border-radius:12px; padding:15px;color:#f0f6ff;font:15px/1.8 Arial,sans-serif; outline:none } textarea:focus{border-color:var(--cyan)} textarea::placeholder{color:#71839f} .buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px} button{ background:#192945;color:#edf6ff;border:1px solid #304563; padding:11px 13px;border-radius:9px;cursor:pointer;font-size:12px } button:hover{border-color:var(--cyan)} button.primary{background:linear-gradient(100deg,var(--cyan),var(--blue));color:#071324;border:0;font-weight:bold} .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px} .stat{padding:15px;background:#0a1325;border:1px solid #223451;border-radius:12px;overflow-wrap:anywhere} .number{font-size:27px;color:var(--cyan);font-weight:bold} .label{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.5} .goalrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px} input{width:110px;padding:10px;background:#080f20;color:white;border:1px solid #304563;border-radius:8px} .progress{height:9px;background:#25334b;border-radius:20px;margin-top:16px;overflow:hidden} .bar{height:100%;width:0;background:linear-gradient(90deg,#438cff,#54e5ff);transition:width .2s} .meta{display:flex;justify-content:space-between;margin-top:9px;font-size:11px;color:var(--muted)} .historyitem{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0a1325;border-radius:10px;padding:12px;margin-top:8px} .historytext{font-size:12px;overflow-wrap:anywhere;min-width:0} .historytext small{display:block;color:var(--muted);margin-top:5px} .historybuttons{display:flex;gap:5px;flex-shrink:0} .historybuttons button{padding:8px} .empty{text-align:center;color:var(--muted);font-size:12px} footer{text-align:center;color:#71839f;font-size:11px;padding:15px} #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#193453;border:1px solid var(--cyan);border-radius:10px;padding:12px 18px;font-size:12px;display:none;max-width:90%;text-align:center} @media(max-width:520px){ main{padding-top:20px}.card{padding:15px}h1{font-size:30px} .stats{grid-template-columns:repeat(2,minmax(0,1fr))} .buttons button{flex:1 1 40%}.number{font-size:24px} } </style> </head> <body> <main> <header> <div class="logo">T+</div> <h1>ტექსტი<span>+</span></h1> <p>ტექსტის ანალიზი • მარტივად და სწრაფად</p> </header> <section class="card"> <h2>✍️ ტექსტის რედაქტორი</h2> <textarea id="text" placeholder="ჩაწერე ან ჩასვი ტექსტი აქ..."></textarea> <div class="buttons"> <button onclick="changeCase('upper')">დიდი ასოები</button> <button onclick="changeCase('lower')">პატარა ასოები</button> <button onclick="cleanSpaces()">გამოტოვებების გასწორება</button> <button onclick="copyText()">კოპირება</button> <button onclick="downloadText()">TXT ჩამოტვირთვა</button> <button class="primary" onclick="saveText()">შენახვა</button> <button onclick="clearText()">გასუფთავება</button> </div> </section> <section class="card"> <h2>📊 სტატისტიკა</h2> <div class="stats"> <div class="stat"><div class="number" id="words">0</div><div class="label">სიტყვა</div></div> <div class="stat"><div class="number" id="chars">0</div><div class="label">სიმბოლო</div></div> <div class="stat"><div class="number" id="noSpaces">0</div><div class="label">სიმბოლო გამოტოვებების გარეშე</div></div> <div class="stat"><div class="number" id="sentences">0</div><div class="label">წინადადება</div></div> <div class="stat"><div class="number" id="paragraphs">0</div><div class="label">აბზაცი</div></div> <div class="stat"><div class="number" id="reading">0 წთ</div><div class="label">კითხვის დრო</div></div> </div> </section> <section class="card"> <h2>🎯 სიტყვების მიზანი</h2> <div class="goalrow"> <label for="goal">მიზანი სიტყვებში:</label> <input id="goal" type="number" min="1" max="1000000" value="500"> </div> <div class="progress"><div class="bar" id="bar"></div></div> <div class="meta"><span id="goalStatus">0 / 500 სიტყვა</span><span id="percent">0%</span></div> </section> <section class="card"> <div class="goalrow"> <h2 style="margin:0">💾 შენახული ტექსტები</h2> <button onclick="clearHistory()">ისტორიის წაშლა</button> </div> <div id="history"></div> </section> <footer>ტექსტი+ · Blue Aurora</footer> </main> <div id="toast"></div> <script> const editor=document.getElementById('text'); const goal=document.getElementById('goal'); let toastTimer; function countWords(s){ s=s.trim(); return s?s.split(/\s+/u).length:0; } function update(){ const s=editor.value; const words=countWords(s); const sentences=(s.match(/[.!?。！？]+/gu)||[]).length; const paragraphs=s.trim()?s.trim().split(/\n\s*\n/u).filter(Boolean).length:0; const target=Math.max(1,Math.min(1000000,Number(goal.value)||1)); const pct=Math.min(100,Math.round(words/target*100)); document.getElementById('words').textContent=words; document.getElementById('chars').textContent=s.length; document.getElementById('noSpaces').textContent=[...s.replace(/\s/gu,'')].length; document.getElementById('sentences').textContent=sentences; document.getElementById('paragraphs').textContent=paragraphs; document.getElementById('reading').textContent=words?Math.max(1,Math.ceil(words/200))+' წთ':'0 წთ'; document.getElementById('bar').style.width=pct+'%'; document.getElementById('goalStatus').textContent=words+' / '+target+' სიტყვა'; document.getElementById('percent').textContent=pct+'%'; } function notify(msg){ const el=document.getElementById('toast'); el.textContent=msg;el.style.display='block'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.style.display='none',2200); } function changeCase(type){ editor.value=type==='upper'?editor.value.toLocaleUpperCase():editor.value.toLocaleLowerCase(); update(); } function cleanSpaces(){ editor.value=editor.value.split('\n') .map(line=>line.replace(/[ \t]+/g,' ').trim()) .join('\n').replace(/\n{3,}/g,'\n\n').trim(); update();notify('გამოტოვებები გასწორდა'); } async function copyText(){ if(!editor.value)return notify('ჯერ ჩაწერე ტექსტი'); try{ await navigator.clipboard.writeText(editor.value); notify('ტექსტი დაკოპირდა'); }catch(e){ editor.select(); const ok=document.execCommand('copy'); editor.setSelectionRange(editor.value.length,editor.value.length); notify(ok?'ტექსტი დაკოპირდა':'კოპირება ვერ მოხერხდა'); } } function downloadText(){ if(!editor.value)return notify('ჯერ ჩაწერე ტექსტი'); const blob=new Blob(['\ufeff',editor.value],{type:'text/plain;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url;a.download='chemi-teksti.txt';a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000); notify('ფაილი ჩამოიტვირთა'); } function clearText(){ if(confirm('ნამდვილად გინდა ტექსტის წაშლა?')){ editor.value='';update();notify('ტექსტი წაიშალა'); } } function getHistory(){ try{return JSON.parse(localStorage.getItem('textPlusHistory')||'[]')} catch(e){return []} } function saveText(){ const content=editor.value.trim(); if(!content)return notify('ჯერ ჩაწერე ტექსტი'); const list=getHistory(); list.unshift({id:Date.now(),content,date:new Date().toLocaleString('ka-GE')}); try{ localStorage.setItem('textPlusHistory',JSON.stringify(list.slice(0,8))); renderHistory();notify('ტექსტი შენახულია'); }catch(e){notify('შენახვა ვერ მოხერხდა')} } function loadText(id){ const item=getHistory().find(x=>x.id===id); if(!item)return; editor.value=item.content;update(); window.scrollTo({top:0,behavior:'smooth'}); notify('ტექსტი ჩაიტვირთა'); } function deleteText(id){ localStorage.setItem('textPlusHistory',JSON.stringify(getHistory().filter(x=>x.id!==id))); renderHistory();notify('ტექსტი წაიშალა'); } function clearHistory(){ if(!getHistory().length)return notify('ისტორია ცარიელია'); if(confirm('წავშალოთ ყველა შენახული ტექსტი?')){ localStorage.removeItem('textPlusHistory');renderHistory(); notify('ისტორია გასუფთავდა'); } } function renderHistory(){ const box=document.getElementById('history'); box.replaceChildren(); const list=getHistory(); if(!list.length){ const p=document.createElement('p');p.className='empty'; p.textContent='შენახული ტექსტები აქ გამოჩნდება'; box.append(p);return; } list.forEach(item=>{ const row=document.createElement('div');row.className='historyitem'; const info=document.createElement('div');info.className='historytext'; const title=document.createElement('div'); title.textContent=item.content.slice(0,45)+(item.content.length>45?'…':''); const date=document.createElement('small'); date.textContent=item.date+' · '+countWords(item.content)+' სიტყვა'; info.append(title,date); const actions=document.createElement('div');actions.className='historybuttons'; const open=document.createElement('button');open.textContent='გახსნა'; open.onclick=()=>loadText(item.id); const del=document.createElement('button');del.textContent='✕'; del.onclick=()=>deleteText(item.id); actions.append(open,del);row.append(info,actions);box.append(row); }); } editor.addEventListener('input',update); goal.addEventListener('input',update); update();renderHistory(); </script> </body> </html>
