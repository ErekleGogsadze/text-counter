<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text Counter</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:25px 16px;background:#090909;color:white;font-family:Arial,sans-serif}
main{max-width:950px;margin:auto}
header{text-align:center;margin:15px 0 30px}
.logo{width:125px;height:125px;object-fit:contain;border-radius:50%;margin-bottom:15px}
h1{font-size:42px;margin:5px}
.sub{color:#aaa}
textarea{width:100%;height:240px;padding:18px;background:#151515;color:white;border:1px solid #444;border-radius:16px;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}
.stat{background:#171717;border:1px solid #444;border-radius:16px;padding:25px 8px;text-align:center}
.num{font-size:36px;font-weight:bold}
.label{color:#bbb;margin-top:8px}
.buttons{display:flex;gap:12px;margin-top:16px}
button{flex:1;padding:14px;border-radius:10px;background:white;color:black;border:0;font-weight:bold}
footer{text-align:center;color:#777;margin-top:25px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<main>
<header>
<img class="logo" src="logo.png" alt="Text Counter logo">
<h1>Text Counter</h1>
<p class="sub">ტექსტის მთვლელი</p>
</header>
<textarea id="text" placeholder="ჩაწერე ან ჩასვი ტექსტი აქ..."></textarea>
<section class="stats">
<div class="stat"><div class="num" id="words">0</div><div class="label">📝 სიტყვები</div></div>
<div class="stat"><div class="num" id="letters">0</div><div class="label">🔤 ასოები</div></div>
<div class="stat"><div class="num" id="digits">0</div><div class="label">🔢 ციფრები</div></div>
<div class="stat"><div class="num" id="punct">0</div><div class="label">✍️ სასვენი ნიშნები</div></div>
</section>
<div class="buttons">
<button onclick="copyText()">ტექსტის კოპირება</button>
<button onclick="clearText()">გასუფთავება</button>
</div>
<footer>Text Counter · უფასო ონლაინ ხელსაწყო</footer>
</main>
<script>
const t=document.getElementById('text');
function count(){
let s=t.value;
document.getElementById('words').textContent=s.trim()?s.trim().split(/\s+/u).length:0;
document.getElementById('letters').textContent=(s.match(/\p{L}/gu)||[]).length;
document.getElementById('digits').textContent=(s.match(/\p{N}/gu)||[]).length;
document.getElementById('punct').textContent=(s.match(/\p{P}/gu)||[]).length;
}
t.addEventListener('input',count);
function clearText(){t.value='';count();}
function copyText(){t.select();document.execCommand('copy');}
</script>
</body>
</html>
